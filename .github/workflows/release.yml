name: Release (unsigned IPA)

# Produces an UNSIGNED .ipa for sideloading via AltStore/SideStore.
# No Apple ID, certificate, or provisioning profile ever touches this pipeline —
# AltStore/SideStore perform real code signing locally on your machine at install time.

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode (latest stable)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache Swift Package Manager artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            Packages/IPTVCore/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Prepare a temporary keychain for Keychain-dependent unit tests
        run: |
          security create-keychain -p "" test-run.keychain
          security set-keychain-settings test-run.keychain
          security unlock-keychain -p "" test-run.keychain
          EXISTING=$(security list-keychains -d user | sed 's/"//g' | xargs)
          security list-keychains -d user -s test-run.keychain $EXISTING
          security default-keychain -s test-run.keychain

      - name: Run IPTVCore package unit tests
        run: swift test --package-path Packages/IPTVCore

      - name: Build unsigned .app for device
        run: |
          xcodebuild build \
            -project IPTVPlayer.xcodeproj \
            -scheme IPTVPlayer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Verify ATS exception made it into the built Info.plist
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/IPTVPlayer.app"
          echo "--- Full built Info.plist ---"
          plutil -p "$APP_PATH/Info.plist"
          echo "--- NSAppTransportSecurity only ---"
          /usr/libexec/PlistBuddy -c "Print :NSAppTransportSecurity" "$APP_PATH/Info.plist"

      # A missing embedded VLCKit wouldn't fail the build — it would dyld-crash the
      # app on launch, wasting a sideload/App-ID slot to discover. Check it here.
      - name: Verify VLCKit is embedded in the app bundle
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/IPTVPlayer.app"
          echo "--- Frameworks directory ---"
          ls -la "$APP_PATH/Frameworks" || true
          if ! ls "$APP_PATH/Frameworks" 2>/dev/null | grep -iq vlc; then
            echo "VLCKit framework is NOT embedded in the app bundle — it would crash on launch." >&2
            exit 1
          fi
          echo "--- Linked libraries referenced by the binary ---"
          otool -L "$APP_PATH/IPTVPlayer" | grep -i vlc || true

      - name: Package .app into an .ipa (Payload/ zip)
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/IPTVPlayer.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Expected app bundle not found at $APP_PATH" >&2
            find build/Build/Products -maxdepth 3 >&2 || true
            exit 1
          fi
          mkdir -p ipa_root/Payload
          cp -R "$APP_PATH" ipa_root/Payload/
          cd ipa_root
          # Bake the short commit SHA into the filename itself (not just the GitHub
          # artifact name) so it's unambiguous which build you're sideloading —
          # Sideloadly/Finder/Downloads all show this name, not the Actions run.
          SHORT_SHA=$(git -C .. rev-parse --short HEAD)
          IPA_NAME="IPTVPlayer-unsigned-${SHORT_SHA}.ipa"
          zip -r -y "../${IPA_NAME}" Payload
          cd ..
          echo "IPA_NAME=${IPA_NAME}" >> "$GITHUB_ENV"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPTVPlayer-unsigned-ipa
          path: ${{ env.IPA_NAME }}
          retention-days: 30

      - name: Attach IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.IPA_NAME }}
          body: |
            Unsigned IPA — install by sideloading with Sideloadly, AltStore, or
            SideStore. Whichever tool you use will sign this on-device with your
            free Apple ID; re-run it every ~7 days to refresh the signature.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
