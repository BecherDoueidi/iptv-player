name: IPTVPlayer
options:
  bundleIdPrefix: com.personal.iptvplayer
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

packages:
  IPTVCore:
    path: Packages/IPTVCore

targets:
  IPTVPlayer:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
        excludes:
          - "Resources/Info.plist"
      - path: Features
    info:
      path: App/Resources/Info.plist
    entitlements:
      path: App/Resources/IPTVPlayer.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.iptvplayer
        PRODUCT_NAME: IPTVPlayer
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_BITCODE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # No local Xcode / no Apple Developer Program membership is used for CI builds.
        # CI produces an unsigned .app; AltStore/SideStore perform real signing on-device.
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
    dependencies:
      - package: IPTVCore
        product: IPTVCore

schemes:
  IPTVPlayer:
    build:
      targets:
        IPTVPlayer: all
    run:
      config: Debug
    archive:
      config: Release
    # No `test:` action yet — IPTVPlayer has no XCTest bundle target until a later
    # phase needs simulator-based SwiftData/view-model tests. Pure logic tests live
    # in Packages/IPTVCore and run via `swift test`, no Xcode scheme needed.
